<header class="app-header">
  <a routerLink="/" class="brand" aria-label="Xomtracks home">
    <picture>
      <source srcset="assets/img/xomtracks-banner.webp" type="image/webp" />
      <img
        src="assets/img/xomtracks-banner.png"
        alt="Xomtracks"
        class="brand-banner"
        width="1100"
        height="369"
        decoding="async"
      />
    </picture>
  </a>

  <nav class="header-actions" *ngIf="cognito.isReady$ | async">
    <ng-container *ngIf="cognito.user$ | async as user; else signedOut">
      <a
        routerLink="/feed"
        routerLinkActive="header-link--active"
        class="header-link"
      >Feed</a>
      <span class="account-email" [title]="user.email">{{ user.email }}</span>
      <button type="button" class="header-btn" (click)="signOut()">Sign out</button>
    </ng-container>
    <ng-template #signedOut>
      <a routerLink="/auth/sign-in" class="header-btn header-btn--primary">Sign in</a>
    </ng-template>
  </nav>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
