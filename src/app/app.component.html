<header class="app-header">
  <a routerLink="/" class="brand" aria-label="Xomtracks home">
    <picture>
      <source srcset="assets/img/xomtracks-banner.webp" type="image/webp" />
      <img
        src="assets/img/xomtracks-banner.png"
        alt="Xomtracks"
        class="brand-banner"
        width="1100"
        height="369"
        decoding="async"
      />
    </picture>
  </a>

  <nav class="header-actions" *ngIf="cognito.isReady$ | async">
    <ng-container *ngIf="cognito.user$ | async as user; else signedOut">
      <button
        type="button"
        class="header-btn header-btn--link"
        (click)="openLinkModal()"
      >Link number</button>

      <!-- Account dropdown: username toggles a menu with Sign out. -->
      <div class="account-menu">
        <button
          type="button"
          class="account-trigger"
          [attr.aria-expanded]="accountMenuOpen"
          aria-haspopup="menu"
          aria-controls="account-menu"
          (click)="toggleAccountMenu($event)"
        >
          <span class="account-email" [title]="user.email">{{ user.email }}</span>
          <span class="account-chevron" [class.account-chevron--open]="accountMenuOpen" aria-hidden="true">▾</span>
        </button>
        <ul
          class="account-dropdown"
          id="account-menu"
          role="menu"
          *ngIf="accountMenuOpen"
        >
          <li role="none">
            <button type="button" role="menuitem" class="account-item" (click)="signOut()">
              Sign out
            </button>
          </li>
        </ul>
      </div>
    </ng-container>
    <ng-template #signedOut>
      <a routerLink="/auth/sign-in" class="header-btn header-btn--primary">Sign in</a>
    </ng-template>
  </nav>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<app-link-phone-modal
  *ngIf="showLinkModal"
  (closed)="closeLinkModal()"
></app-link-phone-modal>
