<article
  class="card"
  [class.card--unmatched]="share.matchStatus === 'unmatched'"
  [class.card--heard]="heard"
>
  <!-- Whole-card trigger: a real button (native keyboard support) laid over
       the card via ::after. Sits under the "Open" link so that link stays
       independently clickable. -->
  <button
    type="button"
    class="card-trigger"
    [attr.aria-label]="'View details for ' + title + (artist ? ' by ' + artist : '')"
    (click)="activate()"
  ></button>

  <div class="cover">
    <img
      *ngIf="hasArt; else noArt"
      class="cover-img"
      [src]="share.albumArtUrl"
      [alt]="'Cover art for ' + title"
      loading="lazy"
      decoding="async"
      (error)="onArtError()"
    />
    <ng-template #noArt>
      <div class="cover-fallback" [attr.data-platform]="share.platform" aria-hidden="true">
        <span class="cover-fallback-mark">♪</span>
      </div>
    </ng-template>

    <span class="platform-badge" [attr.data-platform]="share.platform">
      {{ platformLabel }}
    </span>

    <span
      class="count-badge"
      *ngIf="showCount"
      [attr.aria-label]="'shared ' + shareCount + ' times'"
    >×{{ shareCount }}</span>

    <!-- Heard toggle — sits above the whole-card trigger so it stays clickable. -->
    <button
      type="button"
      class="heard-toggle"
      [class.heard-toggle--on]="heard"
      [attr.aria-pressed]="heard"
      [attr.aria-label]="(heard ? 'Mark unheard: ' : 'Mark heard: ') + title"
      (click)="toggleHeard.emit()"
    >
      <span class="heard-check" aria-hidden="true">{{ heard ? '✓' : '○' }}</span>
      <span class="heard-text">{{ heard ? 'Heard' : 'Heard?' }}</span>
    </button>
  </div>

  <div class="body">
    <div class="titles">
      <h3 class="track-title" [title]="title">{{ title }}</h3>
      <p class="track-artist" *ngIf="artist" [title]="artist">{{ artist }}</p>
      <p class="track-artist track-artist--empty" *ngIf="!artist">—</p>
    </div>

    <span class="status-chip" *ngIf="statusChip as chip" [attr.data-kind]="chip.kind">
      {{ chip.label }}
    </span>

    <div class="meta">
      <span class="sharer">
        <span class="sharer-avatar" aria-hidden="true">{{ sharerInitial }}</span>
        <span class="sharer-name">{{ sharerDisplay }}</span>
      </span>
      <span class="dot-sep" aria-hidden="true">·</span>
      <span class="date">{{ dateLabel }}</span>
    </div>

    <app-rating-stars
      class="card-rating"
      [rating]="share.rating"
      [trackKey]="trackKey"
      (rate)="rate.emit($event)"
    ></app-rating-stars>

    <a
      *ngIf="showOpenLink; else viewHint"
      class="card-open"
      [attr.data-platform]="share.platform"
      [href]="openUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ openLinkLabel }}
      <span class="card-open-arrow" aria-hidden="true">↗</span>
    </a>
    <ng-template #viewHint>
      <span class="view-hint">
        View details
        <span class="view-arrow" aria-hidden="true">→</span>
      </span>
    </ng-template>
  </div>
</article>
