<ng-container *ngIf="cognito.isReady$ | async">
  <ng-container *ngIf="cognito.user$ | async; else publicPitch">
    <!-- The browse feed is the app home: full-page list/tile browsing. -->
    <app-feed></app-feed>

    <!-- The rolling playlists live in a sticky, slide-out side panel / bottom sheet. -->
    <app-feed-panel></app-feed-panel>
  </ng-container>

  <ng-template #publicPitch>
    <app-landing></app-landing>
  </ng-template>
</ng-container>
